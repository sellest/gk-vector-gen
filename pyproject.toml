[build-system]
requires = ["setuptools>=65.5", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gk-vector-mcp"
version = "0.1.0"
description = "Reviewed panel artwork to SVG, TIFF and native CorelDRAW"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=11,<13", "numpy>=2,<3", "opencv-python-headless>=4.10,<6",
  "vtracer==0.6.12", "resvg-py==0.5.0", "mcp>=1.20,<2",
  "pywin32>=308; sys_platform == 'win32'",
]

[project.scripts]
gk-panels = "gk_vector.cli:main"
gk-vector-mcp = "gk_vector.server:main"

[tool.setuptools.packages.find]
where = ["src"]
